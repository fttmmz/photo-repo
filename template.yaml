AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Cloud Photo Repository. Shared infrastructure-as-code template (AWS SAM / CloudFormation).
  Member 1 owns this file's structure; each member adds their own resources in their section below.

# HOW TO USE THIS FILE
# - Each member adds the resources for their part in their own section, on a GitHub branch,
#   and opens a pull request. Member 1 reviews and merges, then deploys with scripts/deploy.sh.
# - Name resources with the stack name so nothing clashes, for example: !Sub '${AWS::StackName}-photos'
# - Stack name: lowercase, 15 characters or fewer (we use "photo-repo"). Region: eu-north-1 (Stockholm).
# - Check the architecture diagram (docs/architecture-aws.png) so the pieces fit together.

Parameters:
  AppName:
    Type: String
    Default: photo-repo
    AllowedPattern: "^[a-z0-9-]{3,20}$"
  EnableTagging:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  AllowedOrigin:
    Type: String
    Default: "*"
  # Member 2 (frontend)
  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to "true" once the AWS account is verified for CloudFront
  # Member 5 (security)
  EnableWaf:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  WafRateLimit:
    Type: Number
    Default: 1000
    MinValue: 10
  # Member 6 (monitoring)
  AlertEmail:
    Type: String
    Default: ""
    Description: Email that receives alarm alerts (empty = no email subscription)
    AllowedPattern: '^$|^[^@\s<>"]+@[^@\s<>"]+\.[^@\s<>"]+$'
    ConstraintDescription: must be a plain email address like name@example.com (no < > or quotes), or empty

Conditions:
  # Member 2 (frontend)
  CloudFrontEnabled: !Equals [!Ref EnableCloudFront, "true"]
  # Member 5 (security)
  TaggingEnabled: !Equals [!Ref EnableTagging, "true"]
  WafEnabled: !Equals [!Ref EnableWaf, "true"]
  # Member 6 (monitoring)
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ------------------------------------------------------------------
  # Member 2: Frontend and content delivery
  #   S3 static hosting bucket for the web UI, CloudFront distribution with HTTPS
  # ------------------------------------------------------------------
  WebUiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-web-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  WebUiDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CloudFrontEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: WebUiS3Origin
            DomainName: !GetAtt WebUiBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id   # Member 5's OAC
        DefaultCacheBehavior:
          TargetOriginId: WebUiS3Origin
          ViewerProtocolPolicy: redirect-to-https
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy   # Member 5's security headers
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  WebUiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CloudFrontEnabled
    Properties:
      Bucket: !Ref WebUiBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebUiBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebUiDistribution}"


  # ------------------------------------------------------------------
  # Member 3: Backend and API
  #   API Gateway routes (upload URL, list, get, delete, search), API Lambda functions,
  #   request validation, throttling
  # ------------------------------------------------------------------
  PhotoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AppName}-api"
      StageName: prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn   # Member 5's user pool
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        # The upload model rejects bad bodies before the Lambda runs, so explain the rules here (E2E-10)
        BAD_REQUEST_BODY:
          StatusCode: 400
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          ResponseTemplates:
            application/json: '{"error": {"code": "INVALID_UPLOAD_REQUEST", "message": "Only JPEG or PNG images up to 10 MB can be uploaded. Send fileName, contentType (image/jpeg or image/png) and fileSize in bytes."}}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40
      Models:
        UploadUrlRequest:
          type: object
          required: [fileName, contentType, fileSize]
          properties:
            fileName: {type: string, minLength: 1, maxLength: 200}
            contentType: {type: string, enum: [image/jpeg, image/png]}
            fileSize: {type: integer, minimum: 1, maximum: 10485760}
            title: {type: string, maxLength: 100}
            description: {type: string, maxLength: 500}
            tags: {type: array, maxItems: 10, items: {type: string, minLength: 1, maxLength: 30}}

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: upload_url.lambda_handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 10
      Tracing: Active
      Role: !GetAtt UploadFunctionRole.Arn   # least-privilege role from Member 5
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref PhotoBucket
          THUMBS_BUCKET: !Ref ThumbBucket
          TABLE_NAME: !Ref PhotosTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref PhotoApi
            Path: /photos/upload-url
            Method: post
            RequestModel:
              Model: UploadUrlRequest
              Required: true
              ValidateBody: true

  ListPhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: list_photos.lambda_handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 10
      Tracing: Active
      Role: !GetAtt ListFunctionRole.Arn
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref PhotoBucket
          THUMBS_BUCKET: !Ref ThumbBucket
          TABLE_NAME: !Ref PhotosTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref PhotoApi
            Path: /photos
            Method: get

  GetPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: get_photo.lambda_handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 10
      Tracing: Active
      Role: !GetAtt GetFunctionRole.Arn
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref PhotoBucket
          THUMBS_BUCKET: !Ref ThumbBucket
          TABLE_NAME: !Ref PhotosTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref PhotoApi
            Path: /photos/{photoId}
            Method: get

  SearchPhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: search_photos.lambda_handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 10
      Tracing: Active
      Role: !GetAtt SearchFunctionRole.Arn
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref PhotoBucket
          THUMBS_BUCKET: !Ref ThumbBucket
          TABLE_NAME: !Ref PhotosTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref PhotoApi
            Path: /photos/search
            Method: get

  DeletePhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: delete_photo.lambda_handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 10
      Tracing: Active
      Role: !GetAtt DeleteFunctionRole.Arn
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref PhotoBucket
          THUMBS_BUCKET: !Ref ThumbBucket
          TABLE_NAME: !Ref PhotosTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref PhotoApi
            Path: /photos/{photoId}
            Method: delete

  # ------------------------------------------------------------------
  # Member 4: Storage, database and image processing
  #   S3 photo bucket (presigned URLs, versioning, lifecycle rules), DynamoDB table,
  #   resize Lambda triggered by S3 uploads, optional Rekognition tagging
  # ------------------------------------------------------------------
  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-photos-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [GET, POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: keep-deleted-versions-30-days
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            ExpiredObjectDeleteMarker: true
          - Id: clean-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
          - Id: originals-to-infrequent-access
            Status: Enabled
            Prefix: originals/
            Transitions:
              - {StorageClass: STANDARD_IA, TransitionInDays: 30}

  ThumbBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-thumbs-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: keep-deleted-versions-30-days
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            ExpiredObjectDeleteMarker: true

  PhotosTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppName}-photos"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: photoId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: photoId, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  ResizeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  ResizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: storage-processing/resize/
      Handler: app.handler
      Runtime: python3.13
      Timeout: 60
      MemorySize: 1024
      Tracing: Active
      DeadLetterQueue: {Type: SQS, TargetArn: !GetAtt ResizeDLQ.Arn}
      Environment:
        Variables:
          TABLE_NAME: !Sub "${AppName}-photos"
          THUMB_BUCKET_NAME: !Sub "${AppName}-thumbs-${AWS::AccountId}-${AWS::Region}"
          ENABLE_TAGGING: !Ref EnableTagging
      Role: !GetAtt ResizeFunctionRole.Arn   # least-privilege role from Member 5
      Events:
        OriginalUploaded:
          Type: S3
          Properties:
            Bucket: !Ref PhotoBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules: [{Name: prefix, Value: originals/}]

  # ------------------------------------------------------------------
  # Member 5: Security and networking
  #   Cognito user pool and auth flow, least-privilege IAM role per Lambda,
  #   private bucket policies, CloudFront Origin Access Control, optional WAF / VPC endpoints
  # ------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-users"
      UsernameAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      MfaConfiguration: "OPTIONAL"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: verified_email, Priority: 1}
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Photo Repository verification code
        EmailMessage: "Your Photo Repository verification code is {####}"
      Schema:
        - {Name: email, AttributeDataType: String, Required: true, Mutable: true}
      DeletionProtection: INACTIVE

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
      ReadAttributes: [email, email_verified]
      WriteAttributes: [email]
      SupportedIdentityProviders: [COGNITO]

  LambdaObservabilityPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets a Lambda write its own CloudWatch logs and X-Ray traces, nothing else
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: WriteOwnLogs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-*:*"
          - Sid: WriteXRayTraces
            Effect: Allow
            Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
            Resource: "*"

  ResizeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Resize Lambda - reads originals, writes renditions, updates the photo record
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaObservabilityPolicy]
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAndRemoveOriginals
                Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-photos-${AWS::AccountId}-${AWS::Region}/originals/*"
              - Sid: WriteRenditions
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${AppName}-thumbs-${AWS::AccountId}-${AWS::Region}/medium/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${AppName}-thumbs-${AWS::AccountId}-${AWS::Region}/thumb/*"
              - Sid: UpdatePhotoRecord
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-photos"
              - Sid: SendFailedEventsToDlq
                Effect: Allow
                Action: [sqs:SendMessage]
                Resource: !GetAtt ResizeDLQ.Arn
              - !If
                - TaggingEnabled
                - Sid: DetectLabels
                  Effect: Allow
                  Action: [rekognition:DetectLabels]
                  Resource: "*"
                - !Ref AWS::NoValue

  UploadFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: API Lambda - issue upload URL and create the PENDING photo record
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaObservabilityPolicy]
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PresignUploadToOriginals
                Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-photos-${AWS::AccountId}-${AWS::Region}/originals/*"
              - Sid: CreatePhotoRecord
                Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-photos"

  ListFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: API Lambda - list a user's photos and sign thumbnail links (read only)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaObservabilityPolicy]
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: QueryOwnPhotos
                Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-photos"
              - Sid: SignThumbnailLinks
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-thumbs-${AWS::AccountId}-${AWS::Region}/thumb/*"

  SearchFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: API Lambda - search a user's photos and sign thumbnail links (read only)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaObservabilityPolicy]
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: QueryOwnPhotos
                Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-photos"
              - Sid: SignThumbnailLinks
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-thumbs-${AWS::AccountId}-${AWS::Region}/thumb/*"

  GetFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: API Lambda - return one photo and sign time-limited links (read only)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaObservabilityPolicy]
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadPhotoRecord
                Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-photos"
              - Sid: SignOriginalLink
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-photos-${AWS::AccountId}-${AWS::Region}/originals/*"
              - Sid: SignMediumLink
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-thumbs-${AWS::AccountId}-${AWS::Region}/medium/*"

  DeleteFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: API Lambda - delete a photo, its renditions and its record
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaObservabilityPolicy]
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAndDeletePhotoRecord
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:DeleteItem]
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-photos"
              - Sid: DeleteOriginal
                Effect: Allow
                Action: [s3:DeleteObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-photos-${AWS::AccountId}-${AWS::Region}/originals/*"
              - Sid: DeleteRenditions
                Effect: Allow
                Action: [s3:DeleteObject]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${AppName}-thumbs-${AWS::AccountId}-${AWS::Region}/medium/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${AppName}-thumbs-${AWS::AccountId}-${AWS::Region}/thumb/*"

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt PhotoBucket.Arn, !Sub "${PhotoBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}
          - Sid: DenyTlsOlderThan12
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt PhotoBucket.Arn, !Sub "${PhotoBucket.Arn}/*"]
            Condition: {NumericLessThan: {"s3:TlsVersion": "1.2"}}
          - Sid: DenyWritesOutsideOriginals
            Effect: Deny
            Principal: "*"
            Action: "s3:PutObject"
            NotResource: !Sub "${PhotoBucket.Arn}/originals/*"

  ThumbBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ThumbBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ThumbBucket.Arn, !Sub "${ThumbBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}
          - Sid: DenyTlsOlderThan12
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ThumbBucket.Arn, !Sub "${ThumbBucket.Arn}/*"]
            Condition: {NumericLessThan: {"s3:TlsVersion": "1.2"}}
          - Sid: DenyWritesOutsideRenditions
            Effect: Deny
            Principal: "*"
            Action: "s3:PutObject"
            NotResource:
              - !Sub "${ThumbBucket.Arn}/medium/*"
              - !Sub "${ThumbBucket.Arn}/thumb/*"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AppName}-web-oac"
        Description: Lets only CloudFront read the private web UI bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AppName}-security-headers"
        Comment: HSTS, no MIME sniffing, no framing, strict referrer policy
        SecurityHeadersConfig:
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}

  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafEnabled
    Properties:
      Name: !Sub "${AppName}-api-acl"
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub "${AppName}-api-acl"}
      Rules:
        - Name: RateLimitPerIp
          Priority: 0
          Action: {Block: {}}
          Statement:
            RateBasedStatement: {Limit: !Ref WafRateLimit, AggregateKeyType: IP}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: RateLimitPerIp}
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: CommonRuleSet}
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: KnownBadInputs}

  # ------------------------------------------------------------------
  # Member 6: Monitoring, testing and cost
  #   CloudWatch logs, metrics, dashboard, alarms (Lambda errors, API 5xx), SNS alerts, billing alarm
  # ------------------------------------------------------------------
  # Same setup Member 6 built in the console (see monitoring/README.md), pointed at this stack's
  # real function and API names. The $5 monthly budget stays in the console: budgets are
  # account-wide and CloudFormation cannot create AWS::Budgets::Budget in eu-north-1.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AppName}-alerts"
      DisplayName: Photo Repository alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-api-5xx-errors"
      AlarmDescription: The photo API returned a 5XX (server) error
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions: [{Name: ApiName, Value: !Sub "${AppName}-api"}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  UploadErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-upload-errors"
      AlarmDescription: The upload-URL Lambda reported an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref UploadUrlFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AppName}-monitoring"
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {
              "title": "Lambda Errors", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
              "metrics": [
                ["AWS/Lambda", "Errors", "FunctionName", "${UploadUrlFunction}"],
                ["AWS/Lambda", "Errors", "FunctionName", "${ListPhotosFunction}"],
                ["AWS/Lambda", "Errors", "FunctionName", "${GetPhotoFunction}"],
                ["AWS/Lambda", "Errors", "FunctionName", "${SearchPhotosFunction}"],
                ["AWS/Lambda", "Errors", "FunctionName", "${DeletePhotoFunction}"],
                ["AWS/Lambda", "Errors", "FunctionName", "${ResizeFunction}"]]}},
            {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {
              "title": "Lambda Invocations", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
              "metrics": [
                ["AWS/Lambda", "Invocations", "FunctionName", "${UploadUrlFunction}"],
                ["AWS/Lambda", "Invocations", "FunctionName", "${ListPhotosFunction}"],
                ["AWS/Lambda", "Invocations", "FunctionName", "${GetPhotoFunction}"],
                ["AWS/Lambda", "Invocations", "FunctionName", "${SearchPhotosFunction}"],
                ["AWS/Lambda", "Invocations", "FunctionName", "${DeletePhotoFunction}"],
                ["AWS/Lambda", "Invocations", "FunctionName", "${ResizeFunction}"]]}},
            {"type": "metric", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {
              "title": "Lambda Duration (ms)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
              "metrics": [
                ["AWS/Lambda", "Duration", "FunctionName", "${UploadUrlFunction}"],
                ["AWS/Lambda", "Duration", "FunctionName", "${ListPhotosFunction}"],
                ["AWS/Lambda", "Duration", "FunctionName", "${GetPhotoFunction}"],
                ["AWS/Lambda", "Duration", "FunctionName", "${SearchPhotosFunction}"],
                ["AWS/Lambda", "Duration", "FunctionName", "${DeletePhotoFunction}"],
                ["AWS/Lambda", "Duration", "FunctionName", "${ResizeFunction}"]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {
              "title": "API 5XXError", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
              "metrics": [["AWS/ApiGateway", "5XXError", "ApiName", "${AppName}-api"]]}},
            {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {
              "title": "API 4XXError", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
              "metrics": [["AWS/ApiGateway", "4XXError", "ApiName", "${AppName}-api"]]}},
            {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {
              "title": "API Latency (ms)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
              "metrics": [["AWS/ApiGateway", "Latency", "ApiName", "${AppName}-api"]]}}
          ]
        }

Outputs:
  # Member 6 (monitoring)
  AlertsTopicArn: {Value: !Ref AlertsTopic}
  DashboardUrl: {Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${AppName}-monitoring"}
  ThumbBucketName: {Value: !Ref ThumbBucket}
  ApiUrl: {Value: !Sub "https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com/prod"}
  # Member 5 (security)
  UserPoolId:           {Value: !Ref UserPool}
  UserPoolClientId:     {Value: !Ref UserPoolClient}
  UserPoolArn:          {Value: !GetAtt UserPool.Arn}
  CognitoRegion:        {Value: !Ref "AWS::Region"}
  CognitoIssuer:        {Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"}
  CloudFrontOacId:      {Value: !GetAtt CloudFrontOAC.Id}
  SecurityHeadersPolicyId: {Value: !Ref SecurityHeadersPolicy}
  ApiWebAclArn:
    Condition: WafEnabled
    Value: !GetAtt ApiWebAcl.Arn
  # Member 2 (frontend)
  WebUiBucketName:
    Value: !Ref WebUiBucket
  WebUiDistributionId:
    Condition: CloudFrontEnabled
    Value: !Ref WebUiDistribution
  WebUiUrl:
    Condition: CloudFrontEnabled
    Value: !Sub 'https://${WebUiDistribution.DomainName}'
